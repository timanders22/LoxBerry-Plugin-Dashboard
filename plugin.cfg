[AUTHOR]
NAME=Dashboard Plugin Authors
EMAIL=dashboard@users.noreply.github.com

[PLUGIN]
VERSION=0.9.11
NAME=dashboard
FOLDER=dashboard
TITLE=Dashboard-Designer

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository. Beide Adressen zeigen auf
# den Zweig master - LoxBerry liest die Fassung dort und vergleicht sie mit der
# oben. Solange beide dieselbe Nummer tragen, wird niemandem etwas angeboten; sobald der
# Zweig 1.0.0 fuehrt, greift die Aktualisierung von selbst.
#
# Wichtig: Adressen NIE auf ein fremdes Repository richten. LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 1.0.0 -
# daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Dashboard/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Dashboard/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# Der Dienst ist reines Python; die beiden Pakete (websockets, cryptography)
# gibt es fuer alle von LoxBerry unterstuetzten Architekturen.
ARCHITECTURE=false
