; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Dashboard designer"
K02 = "<b>A dashboard of your own for wall tablets, without any programming.</b> The plugin reads the structure of the Miniserver — rooms, categories, every block — and builds tile pages from it that any browser can open. No Grafana, no AppDaemon, no Home Assistant."
K03 = "Why there is a service in between"
K04 = "The Miniserver lets <b>31 clients at a time</b> receive state changes. Every tablet with its own connection would use up one of those slots — and would need the login including the password in the browser. That is why <i>one</i> service on the LoxBerry holds <i>one</i> connection and serves any number of tablets with it."
K05 = "How to proceed"
K06 = "<b>Settings:</b> choose the Miniserver (the credentials are already in LoxBerry), start the service."
K07 = "<b>Dashboards:</b> <i>Fetch structure from the Miniserver now</i>, then <i>Generate draft</i>. After that something is there immediately — one page per room, favourites first."
K08 = "<b>Designer:</b> drag tiles, rename them, choose their size, hide them. <b>Do not forget to save.</b>"
K09 = "<b>Dashboards:</b> open the address of the page on the tablet and add it to the home screen."
K10 = "<b>Loxone integration:</b> a virtual input that reports when the dashboard stops updating."
K11 = "The first draft takes nothing away from you"
K12 = "<i>Generate draft</i> may be pressed again at any time: existing pages and all handwork stay untouched, only blocks that appear nowhere yet are added. Only <i>Start from scratch</i> discards everything — and it asks first."
K13 = "Which blocks are supported"
K14 = "Eighteen types have a control element of their own: switch, push-button, dimmer, lighting controller V2 and V1, blind, gate, room controller V2 and V1, staircase light, radio, slider, value selection, alarm system, smoke alarm, colour picker V2 and V1, daytimer. Plus the scene: several commands on one press. Nine further types get a display-only tile — values, states, texts, meters, hour counters, presence, web page and the weather service. (Up to 0.9.12 this said “ten types” and listed eight of them short.)"
K15 = "Every other block type gets a plain tile listing its states — <b>but no switching button</b>. Nobody here knows which command would be right for an unknown type, and a guessed command sent to an alarm system is worse than a missing button."
K16 = "Security"
K17 = "The display page sits in the unauthenticated area — so that a wall tablet can keep it open permanently — and is protected by a long random token in the address."
K18 = "A PIN can be set per page, for instance for a page with a door lock or an alarm."
K19 = "Only what is on a page can be switched, and only with the commands the plugin knows for that block type. Both are checked twice: at the endpoint and again in the service."
K20 = "Credentials are kept in a file of their own with permissions 0600, never in the configuration shown and never in the address."
K21 = "If you want to be more careful still, create a user of your own in Loxone Config who may only use the visualisation, and enter that one under <i>Separate access</i>."
K22 = "If nothing appears"
K23 = "The <i>Test</i> tab walks the chain in order: is the service running? Does the Miniserver answer? Is a structure present? Are the values fresh? Every failed line names the remedy."
K24 = "If it says <i>via HTTP polling</i>, the WebSocket could not be established. The dashboard still works then, but more slowly and with noticeable load on the Miniserver. The log names the reason — usually a wrong password or a user without permission for the visualisation."
K25 = "What has not been tested"
K26 = "This plugin was built without a Miniserver. It was tested against a stub built strictly according to the Loxone documents <i>Communicating with the Miniserver</i> and <i>Structure File</i> (both version 17.0 of 31.03.2026). On 17.08.2026 the following were measured against a Miniserver running firmware 17.1.7.27: login, re-login with a stored token, reading the structure file and the HTTP fallback. What remains unmeasured on the device is the effect of the tile commands and the path for secured controls."
K27 = "Basis"
K28 = "All protocol details come from the two Loxone documents named above. The sections on switch, push-button, radio, slider, value selection and staircase light were missing from the text extract of version 17.0 and were taken from versions 12.2 and 8.3; the states and commands concerned did not change between those versions."
K29 = "The ambient view"
K30 = "If a delay is set on the <i>Settings</i> tab, the controls step back after that time without a touch: what remains is the time, date, weather and up to twelve values — readable from a few metres away, and dimmer than the board. Any touch brings it back; that one touch switches nothing, or a passing hand would be a misfire."
K31 = "The ambient view is modelled on the <i>Ambient Mode</i> of the Loxone app. What is rebuilt is the <b>behaviour</b> — Loxone offers no interface for it, and the plugin does not talk to one; it uses its own values only. To switch it from Loxone, see the command on the <i>Loxone integration</i> tab. It is off by default."
