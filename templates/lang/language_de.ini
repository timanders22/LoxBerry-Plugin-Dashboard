SOUT_TEXT = "Ein virtueller Ausgang genügt, damit der Miniserver das Wandtablet umschaltet - bei Alarm auf die Sicherheitsseite, nachts dunkel, morgens wieder hell. Die Vorlage dafür erzeugt der graue Knopf oben."
SOUT_TITEL = "Schritt 4: Die Anzeigeseite aus Loxone steuern (wahlweise)"
SOUT_WACH = "Weckt den Bildschirm und hebt die Nachtabsenkung auf. <span class='sm-mono'>wach=0</span> gibt sie wieder frei."
