EINLEITUNG = "Dieses Plugin liest AUS dem Miniserver und schreibt IN ihn zurück — die Werte kommen also schon von dort. Was Loxone von hier braucht, ist etwas anderes: die Antwort auf die Frage, ob das Dashboard überhaupt noch läuft. Ein Wandtablet, das seit drei Tagen eine eingefrorene Anzeige zeigt, fällt sonst niemandem auf — bis jemand davorsteht und drückt."
H_TITEL = "Einbindung in Loxone, Schritt für Schritt"
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
S1_TEXT = "Ein virtueller HTTP-Eingang, der die Zustandszeile holt. Wichtig sind vor allem <span class='sm-mono'>OK</span> und <span class='sm-mono'>ALTER</span>: zusammen sagen sie, ob der Dienst noch mit dem Miniserver spricht und wie frisch die Werte sind."
S1_TITEL = "Schritt 1: Zustand des Dashboards überwachen"
S2_HINWEIS = "Wer die Werte trotzdem im Broker haben will, hat sie meist schon: der Miniserver kann sie selbst veröffentlichen, und das Werkzeug dafür ist Loxone Config, nicht dieses Plugin."
S2_TEXT = "Der Reiter MQTT des Hausstandards fehlt hier mit Absicht. Dieses Plugin veröffentlicht nichts: es liest den Miniserver aus und schickt Schaltbefehle unmittelbar an ihn zurück. Ein Umweg über den Broker wäre eine Zwischenstation mehr, die ausfallen kann, und keine einzige Zeile besser."
S2_TITEL = "Schritt 2: Kein MQTT nötig"
S3_ERLAEUTERUNG = "<b>Zu #2:</b> Die Schwelle liegt bewusst bei 300 Sekunden. Der Takt beträgt normalerweise zwei Sekunden; wer bei 10 Sekunden meldet, bekommt bei jedem kurzen Netzhusten eine Nachricht.<br><b>Zu #4 bis #7:</b> Drei Wege führen zur selben Meldung — Dienst tot, Werte alt, Bausteinzahl auf Null. Der letzte fängt den Fall ab, dass die Verbindung zwar steht, die Struktur aber leer ist.<br><b>Zu #8:</b> Die Einschaltverzögerung verhindert eine Meldung beim Neustart des LoxBerry. Fünf Minuten reichen dafür.<br><b>Zu #9:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst über ein ODER zusammenführen — das ist #7.<br><b>Zu #10:</b> Wahlweise. Zeigt das Alter der Werte auf einer beliebigen Loxone-Seite an, damit man beim Vorbeigehen sieht, ob es noch läuft."
S3_TEXT = "Nachgebaut wird die Ausfallmeldung: das Dashboard meldet sich selbst, wenn es stehen bleibt. Loxone Config führt alle Bausteine in der Baustein-Suche (F5)."
S3_TITEL = "Schritt 3: Komplette Baustein-Liste zum 1:1-Nachbauen"
S4_TEXT = "Endpunkt und Anzeigeseite liegen im unangemeldeten Bereich, damit Loxone und die Tablets sie ohne Zugangsdaten erreichen, und sind deshalb durch dieses Token geschützt. Ein neues Token macht <b>alle</b> bereits eingetragenen Adressen ungültig — die in Loxone Config ebenso wie die auf jedem Tablet."
S4_TITEL = "Schritt 4: Das Token"
S5_TEXT = "Diese drei Adressen im Browser aufrufen. Werte, 403, 400 - dann trägt die Einrichtung."
