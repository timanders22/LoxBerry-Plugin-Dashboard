WAS_IST_DAS = "<b>Ein eigenes Dashboard für Wandtablets.</b> Das Plugin liest die Struktur Ihres Miniservers aus — Räume, Kategorien, alle Bausteine — und baut daraus Kachelseiten, die jeder Browser öffnen kann. Ohne Loxone-App, ohne Home Assistant, ohne Node-RED. Der Dienst hält <b>eine</b> Verbindung zum Miniserver und bedient damit beliebig viele Tablets; der Miniserver lässt nur 31 Verbindungen gleichzeitig Zustände empfangen, und jedes Tablet mit eigener Verbindung würde eine davon verbrauchen."
