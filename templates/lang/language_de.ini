[LOX]
ALLES_TEXT = "Statt jeden virtuellen Eingang von Hand anzulegen: die fertige Importdatei erzeugen und in Loxone Config hochladen. Alle Objekte stehen dann samt Titel, Kommentar und Grenzen an Ort und Stelle."
ALLES_TITEL = "Alles auf einmal anlegen"
E1 = "Eine Zeile mit Werten"
E2 = "<span class='sm-mono'>FEHLER;OK=0;GRUND=TOKEN</span> und HTTP 403"
E3 = "<span class='sm-mono'>GRUND=UNBEKANNTE_AKTION</span> und HTTP 400"
E4 = "<span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span> und HTTP 200"
E5 = "<span class='sm-mono'>SELFTEST;OK=0;ERR=TOKEN</span> und HTTP 403"
EINLEITUNG = "Dieses Plugin liest AUS dem Miniserver und schreibt IN ihn zurück — die Werte kommen also schon von dort. Was Loxone von hier braucht, ist etwas anderes: die Antwort auf die Frage, ob das Dashboard überhaupt noch läuft. Ein Wandtablet, das seit drei Tagen eine eingefrorene Anzeige zeigt, fällt sonst niemandem auf — bis jemand davorsteht und drückt."
E_HINWEIS = "Die beiden letzten Zeilen sind das Entscheidende: <b>erst die Gegenprobe mit einem falschen Token macht die erste aussagekräftig.</b> Der Selbsttest beantwortet genau eine Frage - stimmt das Token - und schaltet dabei nichts."
H_TITEL = "Einbindung in Loxone, Schritt für Schritt"
IMPORT_WARNUNG = "Loxone Config <b>legt beim Import neu an und überschreibt nichts</b>. Zweimal importiert heißt doppelte Objekte. Die Adresse im Kopf der Datei ist ein Vorschlag - bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
K_VORLAGE_OUT = "Vorlage der Steuerbefehle erzeugen"
S1_TEXT = "Ein virtueller HTTP-Eingang, der die Zustandszeile holt. Wichtig sind vor allem <span class='sm-mono'>OK</span> und <span class='sm-mono'>ALTER</span>: zusammen sagen sie, ob der Dienst noch mit dem Miniserver spricht und wie frisch die Werte sind."
S1_TITEL = "Schritt 1: Zustand des Dashboards überwachen"
S2_HINWEIS = "Wer die Werte trotzdem im Broker haben will, hat sie meist schon: der Miniserver kann sie selbst veröffentlichen, und das Werkzeug dafür ist Loxone Config, nicht dieses Plugin."
S2_TEXT = "Der Reiter MQTT des Hausstandards fehlt hier mit Absicht. Dieses Plugin veröffentlicht nichts: es liest den Miniserver aus und schickt Schaltbefehle unmittelbar an ihn zurück. Ein Umweg über den Broker wäre eine Zwischenstation mehr, die ausfallen kann, und keine einzige Zeile besser."
S2_TITEL = "Schritt 2: Kein MQTT nötig"
S3_ERLAEUTERUNG = "<b>Zu #2:</b> Die Schwelle liegt bewusst bei 300 Sekunden. Der Takt beträgt normalerweise zwei Sekunden; wer bei 10 Sekunden meldet, bekommt bei jedem kurzen Netzhusten eine Nachricht.<br><b>Zu #4 bis #7:</b> Drei Wege führen zur selben Meldung — Dienst tot, Werte alt, Bausteinzahl auf Null. Der letzte fängt den Fall ab, dass die Verbindung zwar steht, die Struktur aber leer ist.<br><b>Zu #8:</b> Die Einschaltverzögerung verhindert eine Meldung beim Neustart des LoxBerry. Fünf Minuten reichen dafür.<br><b>Zu #9:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst über ein ODER zusammenführen — das ist #7.<br><b>Zu #10:</b> Wahlweise. Zeigt das Alter der Werte auf einer beliebigen Loxone-Seite an, damit man beim Vorbeigehen sieht, ob es noch läuft."
S3_TEXT = "Nachgebaut wird die Ausfallmeldung: das Dashboard meldet sich selbst, wenn es stehen bleibt. Loxone Config führt alle Bausteine in der Baustein-Suche (F5)."
S3_TITEL = "Schritt 5: Komplette Baustein-Liste zum 1:1-Nachbauen"
S4_TEXT = "Endpunkt und Anzeigeseite liegen im unangemeldeten Bereich, damit Loxone und die Tablets sie ohne Zugangsdaten erreichen, und sind deshalb durch dieses Token geschützt. Ein neues Token macht <b>alle</b> bereits eingetragenen Adressen ungültig — die in Loxone Config ebenso wie die auf jedem Tablet."
S4_TITEL = "Schritt 6: Das Token"
S5_TEXT = "Diese fünf Aufrufe im Browser öffnen. Erwartet wird der Reihe nach: eine Zeile mit Werten, 403, 400, 200, 403 – dann trägt die Einrichtung."
S5_TITEL = "Schritt 7: Gegenprobe"
SAUS_HINWEIS = "Die Schwelle deutlich über den Abholtakt legen - bei 60 Sekunden Abholtakt sind 300 Sekunden ein guter Wert. Sonst löst ein einzelner verpasster Durchlauf schon eine Meldung aus. Mehrere Quellen nie direkt an den Benachrichtigungs-Baustein hängen, sondern erst über ODER zusammenführen: er sendet nur beim Wechsel von Aus auf Ein, und eine dauerhaft aktive Quelle verschluckt sonst alle übrigen."
SAUS_TEXT = "Ein virtueller Eingang behält seinen letzten Wert, wenn nichts mehr ankommt. In der App sieht dann alles normal aus, während das Dashboard längst steht. Deshalb wird nicht der Wert überwacht, sondern sein <b>Alter</b>: der Eingang DASHBOARD_ALTER zählt die Sekunden seit dem letzten Abbild."
SAUS_TITEL = "Schritt 4: Ausfallerkennung"
SOUT_AUS = "Die Tafelsteuerung ist im Reiter Einstellungen abgeschaltet. Die Adressen unten antworten dann mit <span class='sm-mono'>GRUND=GESPERRT</span> und HTTP 403, und die Vorlage der Steuerbefehle enthält keinen Befehl – nur einen Hinweis im Kommentar."
SOUT_HELL = "Setzt die Helligkeit der Anzeige in Prozent. 0 ist ein schwarzer Bildschirm, 100 die volle Anzeige."
SOUT_RUHE = "Ruhebild auflegen oder wegnehmen (Ein/Aus)."
SOUT_SEITE = "Schaltet jedes Wandtablet auf die Seite %s."
SOUT_TEXT = "Ein virtueller Ausgang genügt, damit der Miniserver das Wandtablet umschaltet - bei Alarm auf die Sicherheitsseite, nachts dunkel, morgens wieder hell. Die Vorlage dafür erzeugt der graue Knopf oben."
SOUT_TITEL = "Schritt 3: Die Anzeigeseite aus Loxone steuern (wahlweise)"
SOUT_WACH = "Weckt den Bildschirm und hebt die Nachtabsenkung auf. <span class='sm-mono'>wach=0</span> gibt sie wieder frei."
