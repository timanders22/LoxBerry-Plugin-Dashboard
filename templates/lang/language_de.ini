UNGEPRUEFT = "Ob die Token-Anmeldung an Ihrer Firmware durchgeht, ob die Kachel-Befehle am Gerät die erwartete Wirkung haben und wie flüssig sich das Dashboard bei Ihrer Anzahl Bausteine anfühlt — das zeigt nur der echte Miniserver. Das Plugin wurde ohne einen gebaut; geprüft wurde gegen eine Attrappe, die streng nach den Loxone-Dokumenten gebaut ist. Ein Knopf, der hier eine Anmeldung versuchte, wäre zudem gefährlich: nach zu vielen Fehlversuchen sperrt der Miniserver den Zugang für eine Weile."
