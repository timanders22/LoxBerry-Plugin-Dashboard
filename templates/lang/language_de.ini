ALLES_TITEL = "Alles auf einmal anlegen"
E4 = "<span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span> und HTTP 200"
E5 = "<span class='sm-mono'>SELFTEST;OK=0;ERR=TOKEN</span> und HTTP 403"
E_HINWEIS = "Die beiden letzten Zeilen sind das Entscheidende: <b>erst die Gegenprobe mit einem falschen Token macht die erste aussagekraeftig.</b> Der Selbsttest beantwortet genau eine Frage - stimmt das Token - und schaltet dabei nichts."
IMPORT_WARNUNG = "Loxone Config <b>legt beim Import neu an und ueberschreibt nichts</b>. Zweimal importiert heisst doppelte Objekte. Die Adresse im Kopf der Datei ist ein Vorschlag - bitte pruefen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
K_VORLAGE_OUT = "Vorlage der Steuerbefehle erzeugen"
SAUS_HINWEIS = "Die Schwelle deutlich ueber den Abholtakt legen - bei 60 Sekunden Abholtakt sind 300 Sekunden ein guter Wert. Sonst loest ein einzelner verpasster Durchlauf schon eine Meldung aus. Mehrere Quellen nie direkt an den Benachrichtigungs-Baustein haengen, sondern erst ueber ODER zusammenfuehren: er sendet nur beim Wechsel von Aus auf Ein, und eine dauerhaft aktive Quelle verschluckt sonst alle uebrigen."
SAUS_TEXT = "Ein virtueller Eingang behaelt seinen letzten Wert, wenn nichts mehr ankommt. In der App sieht dann alles normal aus, waehrend das Dashboard laengst steht. Deshalb wird nicht der Wert ueberwacht, sondern sein <b>Alter</b>: der Eingang DASHBOARD_ALTER zaehlt die Sekunden seit dem letzten Abbild."
SAUS_TITEL = "Schritt 6: Ausfallerkennung"
SOUT_AUS = "Die Tafelsteuerung ist im Reiter Einstellungen abgeschaltet. Die Adressen unten antworten dann mit <span class='sm-mono'>GRUND=GESPERRT</span> und HTTP 403."
SOUT_HELL = "Setzt die Helligkeit der Anzeige in Prozent. 0 ist ein schwarzer Bildschirm, 100 die volle Anzeige."
SOUT_SEITE = "Schaltet jedes Wandtablet auf die Seite %s."
SOUT_TEXT = "Ein virtueller Ausgang genuegt, damit der Miniserver das Wandtablet umschaltet - bei Alarm auf die Sicherheitsseite, nachts dunkel, morgens wieder hell. Die Vorlage dafuer erzeugt der graue Knopf oben."
