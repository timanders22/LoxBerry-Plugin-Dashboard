; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Dashboard-Designer"
K02 = "<b>Ein eigenes Dashboard für Wandtablets, ohne Programmierarbeit.</b> Das Plugin liest die Struktur des Miniservers aus — Räume, Kategorien, jeden Baustein — und baut daraus Kachelseiten, die jeder Browser öffnen kann. Kein Grafana, kein AppDaemon, kein Home Assistant."
K03 = "Warum ein Dienst dazwischen hängt"
K04 = "Der Miniserver lässt <b>31 Clients gleichzeitig</b> Zustandsänderungen empfangen. Jedes Tablet mit eigener Verbindung würde einen dieser Plätze verbrauchen — und dazu die Anmeldung samt Kennwort im Browser brauchen. Deshalb hält <i>ein</i> Dienst auf dem LoxBerry <i>eine</i> Verbindung und bedient damit beliebig viele Tablets."
K05 = "So gehen Sie vor"
K06 = "<b>Einstellungen:</b> Miniserver auswählen (die Zugangsdaten stehen in LoxBerry schon), Dienst starten."
K07 = "<b>Dashboards:</b> <i>Struktur jetzt vom Miniserver holen</i>, dann <i>Entwurf erzeugen</i>. Danach steht sofort etwas da — je Raum eine Seite, Favoriten zuerst."
K08 = "<b>Designer:</b> Kacheln ziehen, umbenennen, Größe wählen, ausblenden. <b>Speichern nicht vergessen.</b>"
K09 = "<b>Dashboards:</b> Die Adresse der Seite auf dem Tablet öffnen und auf den Startbildschirm legen."
K10 = "<b>Einbindung in Loxone:</b> Ein virtueller Eingang, der meldet, wenn das Dashboard stehen bleibt."
K11 = "Der Erstentwurf nimmt Ihnen nichts weg"
K12 = "<i>Entwurf erzeugen</i> darf man jederzeit wieder drücken: bestehende Seiten und jede Handarbeit bleiben unangetastet, es kommen nur Bausteine hinzu, die noch nirgends stehen. Nur <i>Von vorn anfangen</i> verwirft alles — und fragt vorher nach."
K13 = "Welche Bausteine bedient werden"
K14 = "Achtzehn Typen haben ein eigenes Bedienelement: Schalter, Taster, Dimmer, Lichtsteuerung V2 und V1, Jalousie, Tor, Raumregler V2 und V1, Treppenlicht, Radio, Schieberegler, Wertwahl, Alarmanlage, Brandmelder, Farbwähler V2 und V1, Zeitschaltuhr. Dazu die Szene: mehrere Befehle auf einen Druck. Neun weitere Typen bekommen eine reine Anzeigekachel — Werte, Zustände, Texte, Zähler, Betriebsstunden, Anwesenheit, Webseite und der Wetterdienst. (Bis 0.9.12 stand hier „zehn Typen“ mit einer Aufzählung, der acht davon fehlten.)"
K15 = "Jeder andere Bausteintyp bekommt eine schlichte Kachel, die seine Zustände auflistet — <b>aber keinen Schaltknopf</b>. Welcher Befehl für einen unbekannten Typ richtig wäre, weiß hier niemand, und ein geratener Befehl an eine Alarmanlage ist schlimmer als ein fehlender Knopf."
K16 = "Sicherheit"
K17 = "Die Anzeigeseite liegt im unangemeldeten Bereich — damit ein Wandtablet sie dauerhaft offen halten kann — und ist durch ein langes Zufallstoken in der Adresse geschützt."
K18 = "Je Seite lässt sich eine PIN setzen, etwa für eine Seite mit Türschloss oder Alarm."
K19 = "Geschaltet werden kann nur, was auf einer Seite steht, und nur mit den Befehlen, die das Plugin für diesen Bausteintyp kennt. Beides wird zweimal geprüft: am Endpunkt und noch einmal im Dienst."
K20 = "Zugangsdaten stehen in einer eigenen Datei mit den Rechten 0600, nie in der angezeigten Konfiguration und nie in der Adresse."
K21 = "Wer noch vorsichtiger sein will, legt in Loxone Config einen eigenen Benutzer an, der nur die Visualisierung darf, und trägt den unter <i>Abweichender Zugang</i> ein."
K22 = "Wenn nichts erscheint"
K23 = "Der Reiter <i>Test</i> geht die Kette der Reihe nach durch: Läuft der Dienst? Antwortet der Miniserver? Ist eine Struktur da? Sind die Werte frisch? Jedes Kreuz nennt die Abhilfe mit."
K24 = "Steht dort <i>über HTTP-Abfrage</i>, kam der WebSocket nicht zustande. Das Dashboard funktioniert dann noch, aber langsamer und mit spürbarer Last auf dem Miniserver. Die Logdatei nennt den Grund — meist ein falsches Kennwort oder ein Benutzer ohne Recht für die Visualisierung."
K25 = "Was ungeprüft ist"
K26 = "Dieses Plugin wurde ohne Miniserver gebaut. Geprüft wurde gegen eine Attrappe, die streng nach den Loxone-Dokumenten <i>Communicating with the Miniserver</i> und <i>Structure File</i> (beide Fassung 17.0 vom 31.03.2026) gebaut ist. Am 17.08.2026 sind an einem Miniserver mit Firmware 17.1.7.27 nachgemessen: Anmeldung, Wiederanmeldung mit gespeichertem Token, das Lesen der Strukturdatei und der HTTP-Rückfall. Ungeprüft am Gerät bleiben die Wirkung der Kachel-Befehle und der Weg für gesicherte Bausteine."
K27 = "Grundlage"
K28 = "Alle Protokollangaben stammen aus den beiden genannten Loxone-Dokumenten. Die Abschnitte zu Schalter, Taster, Radio, Schieberegler, Wertwahl und Treppenlicht fehlten im Textauszug der Fassung 17.0 und wurden den Fassungen 12.2 und 8.3 entnommen; die betroffenen Zustände und Befehle haben sich zwischen diesen Fassungen nicht geändert."
K29 = "Das Ruhebild"
K30 = "Ist im Reiter <i>Einstellungen</i> unter <i>Ruhebild nach</i> eine Zeit gesetzt, tritt die Bedienung nach dieser Zeit ohne Berührung zurück: es bleiben Uhrzeit, Datum, Wetter und bis zu zwölf Werte — lesbar aus einigen Metern Entfernung, und dunkler als die Tafel. Jede Berührung holt sie zurück; diese eine Berührung schaltet nichts, sonst wäre ein Griff im Vorbeigehen ein Fehlgriff."
K31 = "Das Ruhebild ist dem <i>Ambient Mode</i> der Loxone-App nachempfunden. Nachgebaut ist das <b>Verhalten</b> — eine Schnittstelle dafür gibt es bei Loxone nicht, und das Plugin spricht auch keine an; es benutzt ausschließlich die eigenen Werte. Wer es aus Loxone schalten will, findet im Reiter <i>Einbindung in Loxone</i> den Befehl dafür. Ab Werk ist es aus."
