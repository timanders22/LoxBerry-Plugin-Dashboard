; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Dashboard-Designer"
K02 = "<b>Ein eigenes Dashboard für Wandtablets, ohne Programmierarbeit.</b> Das Plugin liest die Struktur des Miniservers aus — Räume, Kategorien, jeden Baustein — und baut daraus Kachelseiten, die jeder Browser öffnen kann. Kein Grafana, kein AppDaemon, kein Home Assistant."
K03 = "Warum ein Dienst dazwischen hängt"
K04 = "Der Miniserver lässt <b>31 Clients gleichzeitig</b> Zustandsänderungen empfangen. Jedes Tablet mit eigener Verbindung würde einen dieser Plätze verbrauchen — und dazu die Anmeldung samt Kennwort im Browser brauchen. Deshalb hält <i>ein</i> Dienst auf dem LoxBerry <i>eine</i> Verbindung und bedient damit beliebig viele Tablets."
K05 = "So gehen Sie vor"
K06 = "<b>Einstellungen:</b> Miniserver auswählen (die Zugangsdaten stehen in LoxBerry schon), Dienst starten."
K07 = "<b>Dashboards:</b> <i>Struktur jetzt vom Miniserver holen</i>, dann <i>Entwurf erzeugen</i>. Danach steht sofort etwas da — je Raum eine Seite, Favoriten zuerst."
K08 = "<b>Designer:</b> Kacheln ziehen, umbenennen, Größe wählen, ausblenden. <b>Speichern nicht vergessen.</b>"
K09 = "<b>Dashboards:</b> Die Adresse der Seite auf dem Tablet öffnen und auf den Startbildschirm legen."
K10 = "<b>Einbindung in Loxone:</b> Ein virtueller Eingang, der meldet, wenn das Dashboard stehen bleibt."
K11 = "Der Erstentwurf nimmt Ihnen nichts weg"
K12 = "<i>Entwurf erzeugen</i> darf man jederzeit wieder drücken: bestehende Seiten und jede Handarbeit bleiben unangetastet, es kommen nur Bausteine hinzu, die noch nirgends stehen. Nur <i>Von vorn anfangen</i> verwirft alles — und fragt vorher nach."
K13 = "Welche Bausteine bedient werden"
K14 = "Achtzehn Typen haben ein eigenes Bedienelement: Schalter, Taster, Dimmer, Lichtsteuerung V2 und V1, Jalousie, Tor, Raumregler V2 und V1, Treppenlicht, Radio, Schieberegler, Wertwahl, Alarmanlage, Brandmelder, Farbwähler V2 und V1, Zeitschaltuhr. Dazu die Szene: mehrere Befehle auf einen Druck. Neun weitere Typen bekommen eine reine Anzeigekachel — Werte, Zustände, Texte, Zähler, Betriebsstunden, Anwesenheit, Webseite und der Wetterdienst. (Bis 0.9.12 stand hier „zehn Typen“ mit einer Aufzählung, der acht davon fehlten.)"
K15 = "Jeder andere Bausteintyp bekommt eine schlichte Kachel, die seine Zustände auflistet — <b>aber keinen Schaltknopf</b>. Welcher Befehl für einen unbekannten Typ richtig wäre, weiß hier niemand, und ein geratener Befehl an eine Alarmanlage ist schlimmer als ein fehlender Knopf."
K16 = "Sicherheit"
K17 = "Die Anzeigeseite liegt im unangemeldeten Bereich — damit ein Wandtablet sie dauerhaft offen halten kann — und ist durch ein langes Zufallstoken in der Adresse geschützt."
K18 = "Je Seite lässt sich eine PIN setzen, etwa für eine Seite mit Türschloss oder Alarm. Sie steht nur als Prüfwert in seiten.json, nicht im Klartext. Nach fünf Fehlversuchen ist die PIN der Seite fünf Minuten gesperrt, jede weitere Sperre dauert doppelt so lang; jeder Fehlversuch steht mit Absender im Protokoll."
K19 = "Geschaltet werden kann nur, was auf einer Seite steht, und nur mit den Befehlen, die das Plugin für diesen Bausteintyp kennt. Beides wird zweimal geprüft: am Endpunkt und noch einmal im Dienst."
K20 = "Zugangsdaten stehen in einer eigenen Datei mit den Rechten 0600, nie in der angezeigten Konfiguration und nie in der Adresse."
K21 = "Wer noch vorsichtiger sein will, legt in Loxone Config einen eigenen Benutzer an, der nur die Visualisierung darf, und trägt den unter <i>Abweichender Zugang</i> ein."
K22 = "Wenn nichts erscheint"
K23 = "Der Reiter <i>Test</i> geht die Kette der Reihe nach durch: Läuft der Dienst? Antwortet der Miniserver? Ist eine Struktur da? Sind die Werte frisch? Jedes Kreuz nennt die Abhilfe mit."
K24 = "Steht dort <i>über HTTP-Abfrage</i>, kam der WebSocket nicht zustande. Das Dashboard funktioniert dann noch, aber langsamer und mit spürbarer Last auf dem Miniserver. Die Logdatei nennt den Grund — meist ein falsches Kennwort oder ein Benutzer ohne Recht für die Visualisierung."
K25 = "Was ungeprüft ist"
K26 = "Dieses Plugin wurde ohne Miniserver gebaut. Geprüft wurde gegen eine Attrappe, die streng nach den Loxone-Dokumenten <i>Communicating with the Miniserver</i> und <i>Structure File</i> (beide Fassung 17.0 vom 31.03.2026) gebaut ist. Am 07.09.2026 sind an einem Miniserver mit Firmware 17.2.8.28 nachgemessen: Anmeldung, Wiederanmeldung mit gespeichertem Token, das Lesen der Strukturdatei (666 Bausteine), der HTTP-Rückfall und die Wirkung der Kachel-Befehle. Ungeprüft am Gerät bleibt der Weg für gesicherte Bausteine — es ist kein Visualisierungs-Passwort hinterlegt, an dem man ihn messen könnte."
K27 = "Grundlage"
K28 = "Alle Protokollangaben stammen aus den beiden genannten Loxone-Dokumenten. Die Abschnitte zu Schalter, Taster, Radio, Schieberegler, Wertwahl und Treppenlicht fehlten im Textauszug der Fassung 17.0 und wurden den Fassungen 12.2 und 8.3 entnommen; die betroffenen Zustände und Befehle haben sich zwischen diesen Fassungen nicht geändert."
K29 = "Das Ruhebild"
K30 = "Ist im Reiter <i>Einstellungen</i> unter <i>Ruhebild nach</i> eine Zeit gesetzt, tritt die Bedienung nach dieser Zeit ohne Berührung zurück: es bleiben Uhrzeit, Datum, Wetter und bis zu zwölf Werte — lesbar aus einigen Metern Entfernung, und dunkler als die Tafel. Jede Berührung holt sie zurück; diese eine Berührung schaltet nichts, sonst wäre ein Griff im Vorbeigehen ein Fehlgriff."
K31 = "Das Ruhebild ist dem <i>Ambient Mode</i> der Loxone-App nachempfunden. Nachgebaut ist das <b>Verhalten</b> — eine Schnittstelle dafür gibt es bei Loxone nicht, und das Plugin spricht auch keine an; es benutzt ausschließlich die eigenen Werte. Wer es aus Loxone schalten will, findet im Reiter <i>Einbindung in Loxone</i> den Befehl dafür. Ab Werk ist es aus."
K32 = "Daneben gibt es seit 0.9.17 den <i>Ambient-Modus</i>. Er ist etwas anderes: er gestaltet die Tafel, statt an ihre Stelle zu treten — Uhrzeit, Datum und Wetter stehen dauerhaft über den Kacheln, das Hintergrundbild dahinter, und alles bleibt bedienbar. Bei Loxone heißt das Ruhebild <i>Bildschirmschoner</i> und der andere <i>Ambient-Modus</i>; beide sind einzeln schaltbar und beide ab Werk aus."
K33 = "Als drittes gibt es seit 0.9.18 den <i>Eco-Modus</i>: er senkt die Anzeige ab, wenn niemand das Tablet berührt, und lässt die Kacheln dabei stehen. Die Nachtabsenkung geht nach der Uhr, der Eco-Modus nach der Berührung — treffen beide zusammen, gilt der dunklere von beiden. Ein Helligkeitsbefehl aus Loxone steht über beiden. Alle drei sind einzeln schaltbar und ab Werk aus."
K34 = "Die <b>Wetterzeile</b> unter der Uhr muss nicht von Loxones Wetterdienst kommen. Seit 0.9.19 lassen sich dafür drei eigene Bausteine auswählen — Lage, Temperatur und eine dritte Angabe. Wer eine eigene Station hat (Ecowitt, Weather4Loxone, ein Fühler am Haus), hat deren Werte längst als gewöhnliche Bausteine in Loxone; das Plugin liest sie ohnehin schon und braucht dafür kein MQTT. Bleiben alle drei leer, gilt der Wetterdienst wie bisher. Nach dem Speichern steht unter der Auswahl, was die gewählten Bausteine gerade tragen — der rohe Wert, noch nicht so formatiert wie auf der Tafel. So merkt man nicht erst am Tablet, dass ein Baustein leer ist."
K35 = "Sicherungsverlauf"
K36 = "Im Reiter <i>Einstellungen</i> steht unter der Sicherung ein <b>Sicherungsverlauf</b>: das Plugin behält auf dem LoxBerry die letzten 20 Sicherungen, die es selbst angelegt hat – bei jedem Druck auf <i>Einstellungen sichern</i> und automatisch vor jedem Zurückspielen. Lässt sich der bisherige Stand vorher nicht sichern, wird nicht zurückgespielt – außer er ist beschädigt: dann liegt er als .kaputt-Abschrift daneben, und das Zurückspielen ersetzt ihn ohne Eintrag im Verlauf. Aus dem Verlauf lässt sich jede Sicherung herunterladen, zurückspielen oder löschen; Zurückspielen und Löschen verlangen einen Bestätigungshaken, und das Zurückspielen prüft die Datei genauso streng wie eine hochgeladene. Der Verlauf übersteht ein Update, eine Neuinstallation legt ihn beiseite, die Deinstallation entfernt ihn. Die Dateien tragen Aktionstoken und Zugangsdaten und sind nur für den Benutzer loxberry lesbar."
K37 = "Symbole aus LoxoneIcons"
K38 = "Ist das Plugin <i>LoxoneIcons</i> installiert und hat es seine Symbole geladen, lässt sich im Designer je Kachel ein Symbol wählen – mit Suche nach dem Dateinamen und kleiner Vorschau. Das Dashboard liest die Symbole nur und legt dort nichts an; in seiten.json steht nur der Dateiname. Die Tafel lädt das Symbol vom LoxBerry selbst und zeigt es als Bild, nie als Teil der Seite: ein Symbol kann dort nichts ausführen. Fehlt LoxoneIcons, gibt es kein Feld „Symbol“, und alles andere bleibt, wie es ist."
K39 = "Tablets ohne PIN"
K40 = "Eine PIN gilt je Seite. Wer das Token kennt, kann sie mit fünf falschen Eingaben sperren - bis 0.9.27 traf das auch die Tablets an der Wand. Im Reiter <i>Einstellungen</i> lässt sich unter <b>Tablets ohne PIN</b> eine Liste von Absender-Adressen eintragen: ein Tablet mit einer dieser Adressen wird auf keiner Seite nach der PIN gefragt, auch nicht während einer Sperre. Ab Werk ist die Liste leer. Maßgeblich ist allein die Adresse, von der die Verbindung zum LoxBerry kommt; Kopfzeilen wie X-Forwarded-For werden nie gelesen. Hinter einem Reverse Proxy sieht der LoxBerry nur den Proxy - eine Freigabe seiner Adresse gilt dann für jeden, der über ihn kommt."
K41 = "Tafeln über MQTT steuern"
K42 = "Zusätzlich zum virtuellen Ausgang nimmt der Dienst Tafelbefehle über MQTT an, wenn im Reiter <i>Einstellungen</i> <b>Tafeln zusätzlich über MQTT steuern</b> an ist (ab Werk aus). Themen: <i>Präfix</i>/tafel/alle/seite mit dem Schlüssel der Seite oder ihrer Nummer (1 = erste Seite) und <i>Präfix</i>/tafel/alle/wecken mit 1. Das wirkt auf alle Tafeln, auf demselben Weg wie der virtuelle Ausgang. Zurückbehaltene (retained) Befehle wirken nie. Der Broker ist der des LoxBerry; fällt er aus, bleibt es beim virtuellen Ausgang, und der Reiter <i>Test</i> sagt es. Aus Loxone geht es über das MQTT-Gateway des LoxBerry (UDP-Eingang, Befehl publish)."
K43 = "Vorlage neu importieren?"
K44 = "Beim Herunterladen einer Vorlage merkt sich das Plugin ihre Kennung. Der Reiter <i>Einbindung in Loxone</i> sagt danach je Vorlage, ob die zuletzt heruntergeladene noch zu dem passt, was das Plugin jetzt erzeugen würde - nach einem Update, einem neuen Token, einer neuen Seite oder dem Einschalten der Tafelsteuerung steht dort <b>Vorlage neu importieren</b>. Datum und der Rechnername aus der Adresszeile zählen dabei nicht mit, die Sprache der Oberfläche schon (sie steckt in den Kommentaren). Ob die Datei in Loxone Config importiert wurde, weiß das Plugin nicht."
K45 = "Eingaben nach einer Beanstandung, Warnung beim Sichern"
K46 = "Weist das Plugin eine Eingabe in den Reitern <i>Einstellungen</i> oder <i>Dashboards</i> ab, stehen danach alle eingetippten Werte wieder im Formular, und das beanstandete Feld ist rot umrandet - nur Kennwörter und PINs nicht, die werden nie zurückgegeben. Gespeichert ist dann nichts. Steht in den gespeicherten Einstellungen ein Wert, den das Zurückspielen einer Sicherung abweisen würde, warnt der Knopf <i>Einstellungen sichern</i> gelb und nennt ihn; die Sicherung wird trotzdem geliefert, mit derselben Warnung im Kopf der Datei."
