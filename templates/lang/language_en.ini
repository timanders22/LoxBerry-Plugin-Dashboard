H_ROTATION = "Seconds until the next page. 0 turns rotation off. While someone is operating the tablet it will not advance for one minute - a tablet that switches under your hand is the surest way to a wrong tap."
H_RUECKFALL = "<b>The last resort, not the normal route.</b> With HTTP polling one separate request goes to the Miniserver per block and interval. With 200 blocks that is noticeable. The service therefore logs it loudly when it falls back to this."
H_RUHE = "Ambient view"
H_RUHE_BILD = "JPEG, PNG or WebP, at most %d MB and %d pixels per edge. An empty field keeps the existing image; <b>--</b> removes it. The image is stored <b>unchanged</b> — a phone photo carries its capture data including location, and anyone with the address of the display page can fetch it."
H_RUHE_HELL = "Below 100 the ambient view is darker than the board — text and tiles with it. Allowed values are %d to %d. Night dimming applies on top."
H_RUHE_KACHELN = "How many tiles are shown as values at the bottom, 0 to %d. They only display; nothing is switched until a touch has brought the board back."
H_RUHE_NACH = "Between 60 and 300 seconds works well; allowed are %d to %d. 0 turns the ambient view off — the Loxone command for it then also disappears from the template and from the <i>Loxone integration</i> tab. "
H_RUHE_SEITE = "The shortcuts always show the tiles of the page currently open. If a <i>different</i> page is set here, a touch additionally navigates there — that is the way back to the main page. Empty means: stay where you are."
H_RUHE_WETTER = "Only if a weather service is configured in Loxone. If there is none the line stays empty — nothing is invented."
H_SICHERUNG = "Back up and restore settings"
H_SSE = "Instead of asking every few seconds, the display page keeps one connection open and has changes pushed to it. With three tablets that saves roughly 130,000 requests a day. If the push does not get through, the page falls back to polling <b>and says so</b>."
H_STEUERUNG = "When switched off the dashboard only displays. Good for a tablet in the hallway that should inform rather than switch."
H_TAFELSTEUERUNG = "Allows the Miniserver to switch the displayed page, wake the screen and set the brightness through a virtual output. Affects the display only, never a device. Off by default."
H_TAKT = "This is how often the tablet fetches new values. The service itself receives them immediately when they change — it does not wait for the interval."
H_TLS = "Only second generation Miniservers support this. The first generation lacks the processing power; there the command itself is encrypted instead — which the plugin always does anyway."
H_VERLAUF = "Draws a small curve of the last few hours below the value. The service stores one point per minute for this."
H_VISU_PW = "Stored in <span class='sm-mono'>zugang.json</span> with mode 0600, never in the displayed configuration. It does not leave the LoxBerry: the service builds the hash from it and sends only that. An empty field keeps the current one, two hyphens delete it."
H_WACH = "Browsers only allow both after a touch, some not at all. If it does not work, nothing happens — the page remains usable regardless."
