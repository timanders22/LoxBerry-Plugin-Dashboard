SICH_ERKLAERUNG = "For <b>moving to a second LoxBerry</b>: the file contains the whole setup of this plugin – the settings including the action token, all dashboards with their tiles and PINs (as a check value, not in clear text) and the separate access including the visualisation password. It can be restored there. A backup from 0.9.24 or earlier holds only the settings; pages and access then stay as they are. Every backup you download here is also kept in the backup history further down; before every restore the plugin also saves the current state there."
