[LOX]
ALLES_TEXT = "Instead of creating each virtual input by hand: generate the ready-made import file and upload it in Loxone Config. All objects will then be in place with title, comment and limits."
ALLES_TITEL = "Create everything at once"
E1 = "A line with values"
E2 = "<span class='sm-mono'>FEHLER;OK=0;GRUND=TOKEN</span> and HTTP 403"
E3 = "<span class='sm-mono'>GRUND=UNBEKANNTE_AKTION</span> and HTTP 400"
E4 = "<span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span> and HTTP 200"
E5 = "<span class='sm-mono'>SELFTEST;OK=0;ERR=TOKEN</span> and HTTP 403"
EINLEITUNG = "This plugin reads FROM the Miniserver and writes back INTO it — so the values already come from there. What Loxone needs from here is something else: the answer to whether the dashboard is still running at all. A wall tablet showing a frozen display for three days otherwise goes unnoticed — until someone stands in front of it and presses."
E_HINWEIS = "The last two lines are what matters: <b>only the counter-test with a wrong token makes the first one meaningful.</b> The self-test answers exactly one question - is the token right - and switches nothing while doing so."
H_TITEL = "Loxone integration, step by step"
IMPORT_WARNUNG = "Loxone Config <b>creates new objects on import and overwrites nothing</b>. Importing twice means duplicate objects. The address in the file header is a suggestion - please check that the Miniserver reaches the LoxBerry under that name."
K_TOKEN_NEU = "Generate new token"
K_VORLAGE = "Download template for Loxone Config"
K_VORLAGE_OUT = "Create template for the control commands"
S1_TEXT = "A virtual HTTP input that fetches the status line. What matters most are <span class='sm-mono'>OK</span> and <span class='sm-mono'>ALTER</span>: together they say whether the service is still talking to the Miniserver and how fresh the values are."
S1_TITEL = "Step 1: monitor the state of the dashboard"
S2_HINWEIS = "Anyone who still wants the values in the broker usually already has them: the Miniserver can publish them itself, and the tool for that is Loxone Config, not this plugin."
S2_TEXT = "The MQTT tab of the house standard is deliberately missing here. This plugin publishes nothing: it reads the Miniserver and sends switching commands straight back to it. A detour via the broker would be one more intermediate step that can fail, and not a single line better."
S2_TITEL = "Step 2: no MQTT needed"
S3_ERLAEUTERUNG = "<b>On #2:</b> the threshold is deliberately 300 seconds. The interval is normally two seconds; whoever alerts at 10 seconds gets a message on every brief network hiccup.<br><b>On #4 to #7:</b> three routes lead to the same alert — service dead, values stale, block count at zero. The last catches the case where the connection is up but the structure is empty.<br><b>On #8:</b> the on-delay prevents an alert when the LoxBerry restarts. Five minutes are enough for that.<br><b>On #9:</b> the notification block only fires on a change from off to on. Never wire several sources directly to its input, merge them through an OR first — that is #7.<br><b>On #10:</b> optional. Shows the age of the values on any Loxone page so you can see in passing whether it is still running."
S3_TEXT = "What is rebuilt is the failure alert: the dashboard reports it itself when it stops. Loxone Config lists all blocks in the block search (F5)."
S3_TITEL = "Step 5: complete block list to rebuild one to one"
S4_TEXT = "Endpoint and display page sit in the unauthenticated area so Loxone and the tablets can reach them without credentials, and are therefore protected by this token. A new token invalidates <b>every</b> address already entered — those in Loxone Config as well as those on every tablet."
S4_TITEL = "Step 6: the token"
S5_TEXT = "Open these five calls in a browser. Expected in this order: a line with values, 403, 400, 200, 403 - then the setup holds."
S5_TITEL = "Step 7: cross-check"
SAUS_HINWEIS = "Set the threshold well above the polling interval - with a 60 second poll, 300 seconds is a good value. Otherwise a single missed run already raises an alert. Never wire several sources straight into the notification block; merge them through an OR first: it only fires on a change from off to on, and a permanently active source would otherwise swallow all the others."
SAUS_TEXT = "A virtual input keeps its last value when nothing arrives any more. In the app everything then looks normal while the dashboard has long since stopped. So do not watch the value, watch its <b>age</b>: the input DASHBOARD_ALTER counts the seconds since the last snapshot."
SAUS_TITEL = "Step 4: Failure detection"
SOUT_AUS = "Display control is switched off in the Settings tab. The addresses below then answer with <span class='sm-mono'>GRUND=GESPERRT</span> and HTTP 403, and the template of the control commands holds no command - only a note in its comment."
SOUT_HELL = "Sets the display brightness in percent. 0 is a black screen, 100 the full display."
SOUT_RUHE = "Show or hide the ambient view (on/off)."
SOUT_SEITE = "Switches every wall tablet to the page %s."
SOUT_TEXT = "One virtual output is enough for the Miniserver to switch the wall tablet - to the security page on alarm, dark at night, bright again in the morning. The grey button above creates the template for it."
SOUT_TITEL = "Step 3: Control the display page from Loxone (optional)"
SOUT_WACH = "Wakes the screen and lifts night dimming. <span class='sm-mono'>wach=0</span> releases it again."
TOKEN_FRAGE = "Afterwards the address has to be renewed on EVERY tablet and in Loxone Config. Really?"
TOKEN_NEU = "A new token has been generated. <b>The addresses on all tablets and in Loxone have to be adjusted.</b>"
