WETTERZEILE_ERKLAERUNG = "The line below the clock in ambient mode and on the screensaver. If the installation has no Loxone weather service but a station of its own (Ecowitt, Weather4Loxone, a sensor on the house), its readings already sit in Loxone as ordinary controls — pick them here. Every control carrying a number or text is offered."
