[LOX]
E1 = "A line with values"
E2 = "<span class='sm-mono'>FEHLER;OK=0;GRUND=TOKEN</span> and HTTP 403"
E3 = "<span class='sm-mono'>GRUND=UNBEKANNTE_AKTION</span> and HTTP 400"
EINLEITUNG = "This plugin reads FROM the Miniserver and writes back INTO it &mdash; so the values already come from there. What Loxone needs from here is something else: the answer to whether the dashboard is still running at all. A wall tablet showing a frozen display for three days otherwise goes unnoticed &mdash; until someone stands in front of it and presses."
H_TITEL = "Loxone integration, step by step"
K_TOKEN_NEU = "Generate new token"
K_VORLAGE = "Download template for Loxone Config"
S1_TEXT = "A virtual HTTP input that fetches the status line. What matters most are <span class='sm-mono'>OK</span> and <span class='sm-mono'>ALTER</span>: together they say whether the service is still talking to the Miniserver and how fresh the values are."
S1_TITEL = "Step 1: monitor the state of the dashboard"
S2_HINWEIS = "Anyone who still wants the values in the broker usually already has them: the Miniserver can publish them itself, and the tool for that is Loxone Config, not this plugin."
S2_TEXT = "The MQTT tab of the house standard is deliberately missing here. This plugin publishes nothing: it reads the Miniserver and sends switching commands straight back to it. A detour via the broker would be one more intermediate step that can fail, and not a single line better."
S2_TITEL = "Step 2: no MQTT needed"
S3_ERLAEUTERUNG = "<b>On #2:</b> the threshold is deliberately 300 seconds. The interval is normally two seconds; whoever alerts at 10 seconds gets a message on every brief network hiccup.<br><b>On #4 to #7:</b> three routes lead to the same alert &mdash; service dead, values stale, block count at zero. The last catches the case where the connection is up but the structure is empty.<br><b>On #8:</b> the on-delay prevents an alert when the LoxBerry restarts. Five minutes are enough for that.<br><b>On #9:</b> the notification block only fires on a change from off to on. Never wire several sources directly to its input, merge them through an OR first &mdash; that is #7.<br><b>On #10:</b> optional. Shows the age of the values on any Loxone page so you can see in passing whether it is still running."
S3_TEXT = "What is rebuilt is the failure alert: the dashboard reports it itself when it stops. Loxone Config lists all blocks in the block search (F5)."
S3_TITEL = "Step 3: complete block list to rebuild one to one"
S4_TEXT = "Endpoint and display page sit in the unauthenticated area so Loxone and the tablets can reach them without credentials, and are therefore protected by this token. A new token invalidates <b>every</b> address already entered &mdash; those in Loxone Config as well as those on every tablet."
S4_TITEL = "Step 4: the token"
S5_TEXT = "Open these three addresses in a browser. Values, 403, 400 - then the setup holds."
S5_TITEL = "Step 5: cross-check"
TOKEN_FRAGE = "Afterwards the address has to be renewed on EVERY tablet and in Loxone Config. Really?"
TOKEN_NEU = "A new token has been generated. <b>The addresses on all tablets and in Loxone have to be adjusted.</b>"
