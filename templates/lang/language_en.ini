WAS_IST_DAS = "<b>Your own dashboard for wall tablets.</b> The plugin reads your Miniserver's structure &mdash; rooms, categories, every block &mdash; and builds tile pages from it that any browser can open. No Loxone app, no Home Assistant, no Node-RED. The service holds <b>one</b> connection to the Miniserver and serves any number of tablets from it; the Miniserver only lets 31 clients receive state updates at once, and every tablet with its own connection would use up one of them."
ZUGANG_ERKLAERUNG = "Only fill in if a <b>different</b> account should be used than the one from the LoxBerry configuration &mdash; for example a dedicated Loxone user allowed to use the visualisation and nothing else. That is the safer route. The entries go into a separate file with mode 0600, not into the configuration this page displays. Clearing the address means: use the LoxBerry credentials again."

